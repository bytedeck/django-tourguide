[build-system]
# 77 is the first release supporting PEP 639, which `project.license` as an SPDX string and
# `project.license-files` below both depend on. An older backend fails the isolated build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tourguide"
version = "0.1.0.dev0"
description = "Database-driven, multi-page guided tours for Django, rendered with driver.js."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bytedeck Learning Society" }]
keywords = ["django", "tour", "onboarding", "walkthrough", "tutorial", "driver.js"]
# 5.2 is the oldest Django still receiving support: 5.1 reached end of life on 2025-12-03
# and 4.2 on 2026-04-07. It is also the first release in the supported range to accept
# `CheckConstraint(condition=...)`, which replaced `check=`.
dependencies = ["Django>=5.2"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/bytedeck/django-tourguide"
Issues = "https://github.com/bytedeck/django-tourguide/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursive, because the vendored driver.js sits a directory deeper than the adapter and a
# single-level glob leaves it out of the wheel. That failure only appears in a project that
# installed the package properly, which is the one case developing against a source checkout
# never exercises.
tourguide = ["static/tourguide/**/*", "templates/tourguide/**/*"]

[tool.ruff]
line-length = 150
extend-exclude = ["*/migrations/*"]
target-version = "py310"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, B = flake8-bugbear, C4 = flake8-comprehensions,
# matching the bytedeck house style.
#
# `select` rather than `extend-select`: extend-select adds to whatever ruff's default set
# happens to be, which is both large (400+ rules) and free to change between releases. Being
# explicit keeps a ruff upgrade from failing CI on rules nobody chose.
select = ["E", "W", "F", "B", "C4"]

[tool.coverage.run]
source = ["src/tourguide"]
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
