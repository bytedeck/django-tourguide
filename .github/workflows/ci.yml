name: CI

# `pip install -e .` below runs build code from the checked-out branch, which on a pull request
# is whatever the contributor wrote. Without this block the token inherits the repository
# default, which is write-capable.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. GitHub can drop a `pull_request` event during an Actions incident,
  # leaving a branch with no run at all and no way to ask for one, which happened while this
  # workflow was being written. Cancelling and re-running only works on a run that exists.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, so there is no reason to leave the token in .git/config where
          # build or test code could read it.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to a minor: ruff is a 0.x tool and a new release can add rules, which would
      # fail CI on a change nobody made.
      - run: pip install "ruff>=0.16.1,<0.17"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Explicit combinations rather than a cross product, since not every Django release
      # supports every Python version: 5.2 covers 3.10 to 3.14, while 6.0 and 6.1 start at
      # 3.12. Both ends of each Django's Python range are tested rather than every point in
      # it, so the declared support is backed by a job at each boundary.
      matrix:
        include:
          - { python: "3.10", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          - { python: "3.12", django: "6.0" }
          - { python: "3.14", django: "6.0" }
          - { python: "3.12", django: "6.1" }
          - { python: "3.14", django: "6.1" }
    name: test (py${{ matrix.python }}, dj${{ matrix.django }})
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, so there is no reason to leave the token in .git/config where
          # build or test code could read it.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . "Django~=${{ matrix.django }}.0"
      - run: python -m django test tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings

  demo:
    # The demo project is part of the deliverable, so a change that breaks it should fail CI
    # rather than being found the next time someone tries to screenshot a feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, so there is no reason to leave the token in .git/config where
          # build or test code could read it.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python demo/manage.py check
      - run: python demo/manage.py migrate --noinput

  ci-ok:
    # One check summarising the whole workflow, so branch protection has a single stable name
    # to require. Requiring the matrix jobs individually would mean editing the protection
    # rule every time the matrix changes, and a job renamed on a branch would quietly stop
    # being required rather than failing.
    needs: [lint, test, demo]
    # Without this the job is skipped whenever a dependency fails, so the required check would
    # never report at all and the pull request would sit blocked forever instead of red.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        # `needs.*.result` is success, failure, cancelled or skipped. Testing for anything
        # other than success is what stops a cancelled or skipped job counting as a pass.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::CI did not pass: lint=${{ needs.lint.result }} test=${{ needs.test.result }} demo=${{ needs.demo.result }}"
          exit 1
