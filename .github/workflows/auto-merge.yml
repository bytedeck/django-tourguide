name: Auto-merge

# Arms GitHub's own auto-merge on every pull request, so a pull request lands by itself once
# the required checks are green.
#
# Nothing here judges whether a pull request is good. GitHub holds the merge until everything
# branch protection requires on `main` is satisfied, so what actually gates a merge is the
# ruleset on `main`, not this workflow. If that ruleset is removed, GitHub has nothing to wait
# for and refuses to arm auto-merge at all, which the first step reports rather than merging
# something unchecked.
#
# ## Why this wants a token of its own
#
# Whoever arms auto-merge is who GitHub records as merging, and that identity decides whether
# "Closes #123" in a pull request actually closes the issue: GitHub does not do it when the
# merge is attributed to `github-actions[bot]`, which is the identity of the built-in
# `GITHUB_TOKEN`. So arming auto-merge with the built-in token means every linked issue stays
# open, with no error and no log line.
#
# A workflow reacting to the merge cannot substitute for it, which is the obvious thing to
# reach for: GitHub creates no workflow run at all from an event that `GITHUB_TOKEN`
# triggered, so a `pull_request_target: closed` job never fires for one of these merges.
#
# Setting an `AUTO_MERGE_TOKEN` secret to a fine-grained personal access token, scoped to this
# repository with **contents: read and write** and **pull requests: read and write**, fixes
# both: the merge is attributed to a person, and GitHub closes the linked issues itself.
# Without the secret everything still merges, but linked issues have to be closed by hand, and
# the second step below says so on every run.
#
# The secret is safe to hold here: `pull_request` runs from a fork get no secrets at all, and
# the job below is in any case limited to branches in this repository.

on:
  pull_request:
    # `synchronize` and `ready_for_review` are here so the pull request re-arms itself: auto
    # merge is switched off again if a reviewer requests changes, and a later push should not
    # leave it silently disarmed.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # To read whether `ci-ok` passed on the head commit, which is how the fallback below tells
  # an already-mergeable pull request apart from a repository with nothing gating merges.
  checks: read

# A pull request pushed to several times in a row only needs the newest attempt.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    # Only pull requests raised from a branch in this repository, and only once they are out
    # of draft. A pull request from a fork is written by someone outside the org, and the
    # review that would otherwise catch that is automated, so arming auto-merge on one could
    # land outside code with no person ever having looked at it. Those stay manual.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # The personal access token when the repository has one, and the built-in token
      # otherwise, so a repository without the secret still merges rather than breaking.
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
      # Which of the two it was. A secret cannot be read from a step's `if`, so the answer is
      # carried in a plain environment variable that can.
      OWN_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
    steps:
      - name: Enable auto-merge
        env:
          PR: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # Named separately from `GH_TOKEN` so the rate-limit fallback below has something to
          # fall back to when `GH_TOKEN` is the personal access token.
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub decides asynchronously whether a pull request is blocked, and refuses to arm
          # auto-merge while it still thinks there is nothing to wait for. On a pull request
          # opened seconds ago that verdict can lag its own checks, so a first refusal is
          # usually a timing artefact rather than a real problem.
          for attempt in 1 2 3; do
            if output=$(gh pr merge --auto --squash "$PR" 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            sleep $((attempt * 15))
          done

          # A rate limit says nothing about this pull request: `AUTO_MERGE_TOKEN` spends the
          # quota of the account it belongs to, shared with everything else that account does,
          # and an hour is far longer than anything worth waiting out here. The built-in token
          # has a budget of its own, so arming with that still lands the merge. What it costs
          # is the attribution, and with it the linked issues, which is what the warning is for.
          if [ "$OWN_TOKEN" = true ] && grep -qi 'rate limit' <<<"$output"; then
            echo "::warning::AUTO_MERGE_TOKEN's account is out of API quota, so auto-merge was armed with the built-in token instead. GitHub will record the merge as github-actions[bot] and does not close linked issues for a merge attributed that way, so any 'Closes #123' on this pull request needs doing by hand."
            GH_TOKEN="$BUILTIN_TOKEN" gh pr merge --auto --squash "$PR"
            exit 0
          fi

          # Still refused after the state settled, so this is not a timing artefact.
          if ! grep -qi 'clean status' <<<"$output"; then
            exit 1
          fi

          # "Clean status" means GitHub has nothing left to hold the merge for. That covers two
          # situations which want opposite responses: the checks have already passed, so the
          # pull request should simply be merged; or nothing was ever required, so merging
          # would land code that was never checked. Decide on the evidence rather than
          # guessing, by asking whether `ci-ok` itself is recorded green against this commit.
          #
          # Reading the ruleset would answer the question more directly but is not available
          # here: the built-in token cannot be granted administration scope, so a workflow
          # cannot read a repository's rulesets at all.
          if gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
               --jq '.check_runs[] | select(.name == "ci-ok") | .conclusion' | grep -qx success; then
            echo "ci-ok already passed on ${SHA}, so there was nothing left to wait for. Merging."
            gh pr merge --squash "$PR"
            exit 0
          fi

          echo "::warning::Auto-merge was refused and 'ci-ok' has not passed on ${SHA}, so nothing is gating merges on this repository. Add a ruleset on 'main' requiring the 'ci-ok' status check, then reopen or push to this pull request. Leaving this one to be merged by hand."
          exit 0

      # Said on every run rather than once, because the failure it describes is silent: an
      # issue that quietly stays open looks exactly like one nobody linked.
      - name: Say so if linked issues will not close by themselves
        if: env.OWN_TOKEN != 'true'
        run: |
          echo "::warning::No AUTO_MERGE_TOKEN secret, so auto-merge is armed with the built-in token and GitHub will record the merge as github-actions[bot]. It does not close linked issues for a merge attributed that way, so any 'Closes #123' on this pull request will need doing by hand. See the comment at the top of this workflow for the fix."
